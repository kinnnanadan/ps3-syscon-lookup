<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS3 Syscon エラーコード検索</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="header-top">
        <h1>PS3 Syscon エラーコード検索</h1>
        <button id="themeToggle" class="theme-btn" aria-label="テーマ切替">🌙 ダーク</button>
      </div>
      <p class="site-description">
        PlayStation 3 の Syscon エラーログ（UART出力など）から、故障の原因と修理・切り分けの対処方法を検索できるデータベースです。カンマ区切り（例: 1001,1002）での複数検索や全角数字での入力にも対応しています。
      </p>
    </header>

    <main>
      <div class="search-box">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="コードやキーワードを入力 (例: 1001,1002 / ３０３４ / CELL)">
          <button id="clearBtn" class="clear-btn hidden" aria-label="検索をクリア" title="クリア">×</button>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-group">
          <span class="filter-label">番台：</span>
          <div class="filter-bar" id="rangeFilterBar" role="group" aria-label="エラーコード番台絞り込み">
            <button class="filter-btn active" data-range="all">すべて</button>
            <button class="filter-btn" data-range="1">1000番台</button>
            <button class="filter-btn" data-range="2">2000番台</button>
            <button class="filter-btn" data-range="3">3000番台</button>
            <button class="filter-btn" data-range="4">4000番台</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-label">関連：</span>
          <div class="filter-bar" id="tagFilterBar" role="group" aria-label="部位・部品絞り込み">
            <button class="filter-btn active" data-tag="all">すべて</button>
            <button class="filter-btn" data-tag="cell">CELL</button>
            <button class="filter-btn" data-tag="rsx">RSX</button>
            <button class="filter-btn" data-tag="capacitor">コンデンサ</button>
          </div>
        </div>
      </div>

      <div class="result-meta">
        <span id="resultCount"></span>
      </div>

      <div id="results"></div>
    </main>

    <footer class="site-footer">
      <p>
        参考資料: <a href="https://www.psdevwiki.com/ps3/Syscon_Error_Codes" target="_blank" rel="noopener noreferrer">PS3 Developer Wiki - Syscon Error Codes</a>
      </p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
