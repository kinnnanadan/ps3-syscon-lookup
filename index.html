<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS3 Syscon エラーコード検索</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="header-top">
        <h1>PS3 Syscon エラーコード検索</h1>
        <button id="themeToggle" class="theme-btn" aria-label="テーマ切替">🌙 ダーク</button>
      </div>
      <p class="site-description">
        PlayStation 3 の Syscon エラーログ（UART出力など）から、故障の原因と修理・切り分けの対処方法を検索できるデータベースです。エラーコード（下4桁のみでも可）や部品名で検索できます。
      </p>
    </header>

    <main>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="エラーコードやキーワードを入力 (例: 1001, 3034, CELL)">
      </div>
      <div id="results"></div>
    </main>

    <footer class="site-footer">
      <p>
        参考資料: <a href="https://www.psdevwiki.com/ps3/Syscon_Error_Codes" target="_blank" rel="noopener noreferrer">PS3 Developer Wiki - Syscon Error Codes</a>
      </p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
